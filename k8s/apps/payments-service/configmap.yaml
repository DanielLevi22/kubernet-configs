apiVersion: v1
kind: ConfigMap

metadata:
  name: payments-service
  namespace: marketplace
data:
  PORT: "3004"
  NODE_ENV: production
  DB_HOST: host.docker.internal
  DB_PORT: "5435"
  DB_USERNAME: postgres
  DB_DATABASE: payments_db
  JWT_EXPIRES_IN: 24h
  RABBITMQ_QUEUE_PAYMENTS: payment-queue
  RABBITMQ_EXCHANGE: payments
  USERS_SERVICE_URL: http://users-service
  PRODUCTS_SERVICE_URL: http://products-service
  CHECKOUT_SERVICE_URL: http://checkout-service
  PAYMENT_GATEWAY_URL: https://api.stripe.com/v1
