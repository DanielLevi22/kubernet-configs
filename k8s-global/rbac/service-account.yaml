# ==========================================================
# SERVICE ACCOUNT
# Conta utilizada por aplicações ou Pods
# ==========================================================

apiVersion: v1
kind: ServiceAccount
metadata:
  name: company-sa
  namespace: default

---

# ==========================================================
# ROLE
# Permite visualizar Pods dentro do namespace "default"
# ==========================================================

apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: read-pod
  namespace: default
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs:
      - get
      - list
      - watch

---

# ==========================================================
# ROLE BINDING
# Associa a Role ao ServiceAccount
# ==========================================================

apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: read-pod-sa-binding
  namespace: default
subjects:
  - kind: ServiceAccount
    name: company-sa
    namespace: default

roleRef:
  kind: Role
  name: read-pod
  apiGroup: rbac.authorization.k8s.io